name: Multi-Repo Version Monitor

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时一次
  workflow_dispatch: # 手动触发按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ['langgenius/dify','langchain-ai/langgraph-supervisor-py','google-a2a/A2A','infiniflow/ragflow']
    name: Monitor ${{ matrix.repo }}
    
    steps:
    - name: Checkout with token
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 # 获取完整历史
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests pygithub
        sudo apt-get update && sudo apt-get install -y jq
        sudo apt-get install -y git-extras  # 安装有用的Git扩展
        
    - name: Configure GitHub CLI
      run: |
        # 安装 GitHub CLI
        type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt update
        sudo apt install gh -y
        
        # 使用个人令牌登录
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
        gh config set prompt disabled
        
    # 修正版：检查更新步骤
    - name: Check for updates
      id: check
      env:
        TARGET_REPO: ${{ matrix.repo }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 生成安全的文件名
        repo_safe=$(echo "$TARGET_REPO" | sed 's/[^a-zA-Z0-9]/_/g')
        # repo_safe=$(echo "$TARGET_REPO")
        echo "------$TARGET_REPO" >> $GITHUB_OUTPUT
        echo "------$repo_safe" >> $GITHUB_OUTPUT
        
        # 调用监控脚本 - 只捕获标准输出（忽略标准错误）
        new_version=$(python repo_monitor.py "$repo_safe" 2>/dev/null)
        
        # 调试：显示获取的版本号
        echo "提取的版本号: '$new_version'"
        
        # 判断是否检测到新版本
        if [[ -n "$new_version" && "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✅ 检测到新版本: $new_version"
            echo "repo_safe=$repo_safe" >> $GITHUB_OUTPUT
            echo "new_version=$new_version" >> $GITHUB_OUTPUT
            echo "has_update=true" >> $GITHUB_OUTPUT
        else
            if [[ -n "$new_version" ]]; then
                echo "⚠️ 无效版本格式: '$new_version'"
            else
                echo "ℹ️ 没有检测到新版本"
            fi
            echo "repo_safe=$repo_safe" >> $GITHUB_OUTPUT
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "has_update=false" >> $GITHUB_OUTPUT
        fi
        
    # 处理版本更新
    - name: Handle version update
      if: ${{ steps.check.outputs.has_update == 'true' }}
      env:
        TARGET_REPO: ${{ matrix.repo }}
        NEW_VERSION: ${{ steps.check.outputs.new_version }}
        repo_safe: ${{ steps.check.outputs.repo_safe }}
      run: |
        # 确保远程HEAD设置
        git remote set-head origin -a
        
        # 确定默认分支
        ACTUAL_BRANCH=$(git remote show origin | grep 'HEAD branch:' | awk '{print $NF}')
        if [ -z "$ACTUAL_BRANCH" ]; then
          echo "无法确定默认分支，使用'main'作为后备方案..."
          ACTUAL_BRANCH="main"
        fi
        
        # 验证分支存在
        if ! git branch -r | grep -q "origin/$ACTUAL_BRANCH"; then
          echo "错误：默认分支 $ACTUAL_BRANCH 不存在"
          echo "可用分支："
          git branch -r
          exit 1
        fi
        
        # 切换到默认分支并更新
        git checkout "$ACTUAL_BRANCH"
        git fetch --all
        git reset --hard "origin/$ACTUAL_BRANCH"
        git clean -fd
        
        # 创建新分支
        TIMESTAMP=$(date +%s)
        BRANCH_NAME="update-$repo_safe-$NEW_VERSION-$TIMESTAMP"
        git checkout -b "$BRANCH_NAME"
        
        # 配置Git用户
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        
        # 准备版本历史文件
        FILE_NAME="version_history_$repo_safe.json"
        if [ ! -f "$FILE_NAME" ]; then
          echo "初始化 $FILE_NAME..."
          echo "{}" > "$FILE_NAME"
        fi
        
        # 实际更新文件内容
        echo "更新 $FILE_NAME 到新版本 $NEW_VERSION..."
        # 使用jq更新JSON文件
        jq --arg ver "$NEW_VERSION" --arg ts "$TIMESTAMP" \
           '.version = $ver | .timestamp = ($ts | tonumber)' \
           "$FILE_NAME" > tmp.json && mv tmp.json "$FILE_NAME"
        
        # 检查是否有变更需要提交
        if git diff --quiet; then
          echo "警告：版本文件内容未改变，跳过提交"
        else
          # 添加并提交变更
          git add "$FILE_NAME"
          git commit -m "更新 $TARGET_REPO 到 $NEW_VERSION"
          
          # 推送分支
          git push origin "$BRANCH_NAME" --force
          
          # 创建PR
          gh pr create \
            --title "更新 $TARGET_REPO 到 $NEW_VERSION" \
            --body "自动化版本更新" \
            --base $ACTUAL_BRANCH \
            --head "$BRANCH_NAME"
          
          # 自动合并PR
          gh pr merge "$BRANCH_NAME" --auto --delete-branch --merge
        fi
        
    - name: Send email notification
      if: ${{ steps.check.outputs.has_update == 'true' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 465
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "New release: ${{ steps.check.outputs.new_version }} for ${{ matrix.repo }}"
        body: "A new version ${{ steps.check.outputs.new_version }} has been released in ${{ matrix.repo }}"
        from: "Github Action Monitoring"
        to: ${{ secrets.RECIPIENT_EMAIL }}
