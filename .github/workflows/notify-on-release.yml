name: External Repo Monitor

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时一次
  workflow_dispatch: # 手动触发按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      new_version: ${{ steps.check.outputs.new_version }}
    
    strategy:
      matrix:
        repo: ['langgenius/dify', 'langchain-ai/langgraph-supervisor-py']
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests
        sudo apt-get update && sudo apt-get install -y jq
        
    - name: Check for updates
      id: check
      env:
        TARGET_REPO: ${{ matrix.repo }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python repo_monitor.py
      
    - name: Handle version update
      if: ${{ steps.check.outputs.has_update == 'true' }}
      env:
        NEW_VERSION: ${{ steps.check.outputs.new_version }}
      run: |
        # 1. 配置用户信息
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        
        # 2. 获取最新远程变更
        git fetch origin
        git pull --rebase origin main
        
        # 3. 创建新分支
        TIMESTAMP=$(date +%s)
        BRANCH_NAME="version-update-$NEW_VERSION-$TIMESTAMP"
        git checkout -b $BRANCH_NAME
        
        # 4. 添加和提交更改
        git add version_history.json
        git commit -m "Update to version $NEW_VERSION"
        
        # 5. 推送新分支
        git push origin $BRANCH_NAME
        
        # 6. 创建 Pull Request
        PR_TITLE="Update version to $NEW_VERSION"
        PR_BODY="Automated version update from GitHub Actions"
        gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base main --head $BRANCH_NAME
        
        # 7. 可选：自动合并
        gh pr merge $BRANCH_NAME --auto --delete-branch --merge
        
        # 8. 设置输出变量
        echo "PR_BRANCH=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "PR_CREATED=true" >> $GITHUB_OUTPUT
        
    - name: Send email notification
      if: ${{ steps.check.outputs.has_update == 'true' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 465
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "New release: ${{ steps.check.outputs.new_version }}"
        body: "A new version ${{ steps.check.outputs.new_version }} has been detected and updated in our repository."
        to: ${{ secrets.RECIPIENT_EMAIL }}
