name: Multi-Repo Version Monitor

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时一次
  workflow_dispatch: # 手动触发按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ['langgenius/dify', 'langchain-ai/langgraph-supervisor-py']
    name: Monitor ${{ matrix.repo }}
    
    steps:
    - name: Checkout with token
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 # 获取完整历史
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests pygithub
        sudo apt-get update && sudo apt-get install -y jq
        
    - name: Configure GitHub CLI
      run: |
        # 安装 GitHub CLI（如果尚未安装）
        if ! command -v gh &> /dev/null; then
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
        fi
        
        # 使用个人令牌登录
        echo ${{ secrets.GITHUB_TOKEN }} | gh auth login --with-token
        gh config set prompt disabled
        
    - name: Check for updates
      id: check
      env:
        TARGET_REPO: ${{ matrix.repo }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 生成安全的文件名
        repo_safe=$(echo "$TARGET_REPO" | sed 's/[^a-zA-Z0-9]/_/g')
        python repo_monitor.py "$repo_safe"
        
    - name: Handle version update
      if: ${{ steps.check.outputs.has_update == 'true' }}
      env:
        NEW_VERSION: ${{ steps.check.outputs.new_version }}
        TARGET_REPO: ${{ matrix.repo }}
      run: |
        # 生成安全名称
        repo_safe=$(echo "$TARGET_REPO" | sed 's/[^a-zA-Z0-9]/_/g')
        
        # 1. 更新工作区
        git fetch origin
        git reset --hard origin/main
        git clean -fd
        git pull --rebase
        
        # 2. 创建新分支（包含仓库名称）
        TIMESTAMP=$(date +%s)
        BRANCH_NAME="update-$repo_safe-$NEW_VERSION-$TIMESTAMP"
        git checkout -b "$BRANCH_NAME"
        
        # 3. 配置用户
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        
        # 4. 添加和提交更改
        FILE_NAME="monitoring/version_history_$repo_safe.json"
        git add "$FILE_NAME"
        git commit -m "Update $TARGET_REPO to $NEW_VERSION"
        
        # 5. 推送新分支
        git push origin "$BRANCH_NAME" --force
        
        # 6. 创建 PR
        gh pr create \
          --title "Update $TARGET_REPO to $NEW_VERSION" \
          --body "Automated version update for $TARGET_REPO" \
          --base main \
          --head "$BRANCH_NAME"
        
        # 7. 自动合并
        gh pr merge "$BRANCH_NAME" --auto --delete-branch --merge
        
    - name: Send email notification
      if: ${{ steps.check.outputs.has_update == 'true' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 465
        username: ${{ secrets.SMTP_USER }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "New release: ${{ steps.check.outputs.new_version }} for ${{ matrix.repo }}"
        body: "A new version ${{ steps.check.outputs.new_version }} has been released in ${{ matrix.repo }}"
        to: ${{ secrets.RECIPIENT_EMAIL }}
