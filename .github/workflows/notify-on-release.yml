name: External Repo Monitor

on:
  schedule:
    - cron: '0 */1 * * *' # 每小时一次
  workflow_dispatch: # 手动触发按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      new_version: ${{ steps.check.outputs.new_version }}
      release_body: ${{ steps.check.outputs.release_body }}
    
    strategy:
      matrix:
        repo: ['langgenius/dify', 'langchain-ai/langgraph-supervisor-py']
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: pip install requests
        
    - name: Check for updates
      id: check
      env:
        TARGET_REPO: ${{ matrix.repo }}
        GITHUB_TOKEN: ${{ email_secrets.GITHUB_TOKEN }}
      run: python repo_monitor.py
      
    - name: Update current version
      run: |
        if [ -f version_history.json ]; then
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add version_history.json
          git commit -m "Update current version"
          git push
        fi
        
    - name: Send email notification
      if: ${{ steps.monitor.outputs.has_update == 'true' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ email_secrets.SMTP_SERVER }}
        server_port: 465
        username: ${{ email_secrets.SMTP_USER }}
        password: ${{ email_secrets.SMTP_PASSWORD }}
        subject: "New release: ${{ steps.monitor.outputs.new_version }}"
        html_body: ${{ steps.monitor.outputs.release_body }}
        to: ${{ email_secrets.RECIPIENT_EMAIL }}
